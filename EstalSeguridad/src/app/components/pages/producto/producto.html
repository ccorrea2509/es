<a class="btn btn-success" routerLink="/crear_producto">NUEVO</a>
<h2>Lista de Productos</h2>

<table class="table">
  <thead>
    <tr>
      <th scope="col">#</th>
      <th scope="col">SKU</th>
      <th scope="col">NOMBRE</th>
      <th scope="col">CATEGORIA</th>
      <th scope="col">PRECIO</th>
      <th scope="col">STOCK ACTUAL</th>
      <th scope="col">MIN STOCK</th>
      <th scope="col">Acciones</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let p of productos()">
      <th scope="row"> {{ p.id }} </th>
      <td> {{ p.sku }} </td>
      <td> {{ p.nombre }} </td>
      <td> {{ p.categoria }} </td>
      <td> ${{ p.precio }} </td>
      <td> {{ p.stock_actual }} </td>
      <td> {{ p.stock_minimo }} </td>
      <td><a routerLink="/editar_producto/{{ p.id }}" class="btn btn-primary">edit</a><a class="btn btn-danger">Eliminar</a></td>
    </tr>
    
  </tbody>
</table>
